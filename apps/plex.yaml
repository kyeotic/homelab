version: '2'
services:
  plex:
    container_name: plex
    image: plexinc/pms-docker
    restart: unless-stopped
    network_mode: host
    ports:
      - 32400:32400/tcp
      - 8324:8324/tcp
      - 32469:32469/tcp
      - 1900:1900/udp
      - 32410:32410/udp
      - 32412:32412/udp
      - 32413:32413/udp
      - 32414:32414/udp
    environment:
      - TZ=America/Los_Angeles
      - PLEX_CLAIM=_GET_A_PLEX_CLAIM
      - PUID=1000
      - PGID=1000
    volumes:
      - ${USERDIR}/docker/plexms/config:/config
      - ${USERDIR}/docker/plexms/transcodes:/transcode
      - /mnt/data:/data
