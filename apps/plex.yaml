version: '2'
services:
  plex:
    container_name: plex
    image: plexinc/pms-docker
    restart: unless-stopped
    # network_mode: host
    ports:
      - 32400:32400/tcp
      - 8324:8324/tcp
      - 32469:32469/tcp
      - 1900:1900/udp
      - 32410:32410/udp
      - 32412:32412/udp
      - 32413:32413/udp
      - 32414:32414/udp
    environment:
      - TZ=America/Los_Angeles
      - PLEX_CLAIM=${PLEX_CLAIM:?err}
      - PUID=1000
      - PGID=10000
      - ADVERTISE_IP=http://192.168.0.20:32400
    volumes:
      - /mnt/app_config/plexms/config:/config
      - /mnt/app_config/plexms/transcodes:/transcode
      - /mnt/media_root/media:/data
