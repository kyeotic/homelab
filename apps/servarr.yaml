###########################################################################
##  Docker Compose File:  Calibre-Web-Automated
##  Function:             eBooks Library Manager
##  Documentation:        https://github.com/crocodilestick/Calibre-Web-Automated
###########################################################################
  calibre:
    image: crocodilestick/calibre-web-automated:latest
    container_name: calibre-web-automated
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - TZ=${TIMEZONE:?err}
      - TZ=${TIMEZONE:?err}
      - HARDCOVER_API_KEY=${HARDCOVER_API_KEY:?err}
      # If your library is on a network share (e.g., NFS/SMB), disable WAL to reduce locking issues
      # Accepts: true/false (default: false)
      - NETWORK_SHARE_MODE=true
      # Override the default port (8083) for the web server.
      # Accepts any valid port number.
      - CWA_PORT_OVERRIDE=${WEBUI_PORT_CALIBRE:?err}
    volumes:
      # CW users migrating should stop their existing CW instance, make a copy of the config folder, and bind that here to carry over all of their user settings ect.
      - ${FOLDER_FOR_CONFIGS:?err}/calibre-web-automated:/config
      # This is an ingest dir, NOT a library one.
      # Anything added here will be automatically added to your library
      # according to the settings you have configured in CWA Settings page.
      # All files placed here are REMOVED AFTER PROCESSING
      - ${FOLDER_FOR_MEDIA:?err}/books-ingest:/cwa-book-ingest
      # If you don't have an existing library, CWA will automatically create one at the bind provided here
      - ${FOLDER_FOR_MEDIA:?err}/media/reading/library:/calibre-library
      # If you use calibre plugins, you can bind your plugins folder here to have CWA
      # attempt to add them to its workflow (WIP)
      # If you are starting with a fresh install, you also need to copy customize.py.json
      # to the Calibre config volume above,
      # in /path/to/config/folder/.config/calibre/customize.py.json, see the note below for more info
      - ${FOLDER_FOR_CONFIGS:?err}/calibre-web-automated:/config/.config/calibre/plugins
    ports:
      # Change the first number to change the port you want to access the Web UI, not the second
      - ${WEBUI_PORT_CALIBRE:?err}:${WEBUI_PORT_CALIBRE:?err}
    restart: unless-stopped

