###########################################################################
##  Docker Compose File:    Gluetun (qmcgaw)
##  Function:               VPN Client
##  Documentation:          https://github.com/qdm12/gluetun-wiki
##  Dockerhub:              https://hub.docker.com/r/qmcgaw/gluetun
###########################################################################
services:
  gluetun:
    image: qmcgaw/gluetun:v3.39
    container_name: gluetun
    restart: always
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8888:8888/tcp"                         # Gluetun Local Network HTTP proxy
      - "8388:8388/tcp"                         # Gluetun Local Network Shadowsocks
      - "8388:8388/udp"                         # Gluetun Local Network Shadowsocks
      - "${WEBUI_PORT_QBITTORRENT:?err}:${WEBUI_PORT_QBITTORRENT:?err}"   # WebUI Portal: qBittorrent
      - "${WEBUI_PORT_TRANSMISSION:?err}:${WEBUI_PORT_TRANSMISSION:?err}"   # WebUI Portal: qBittorrent
      # - "${QBIT_PORT_TCP:?err}:6881/tcp"        # Transmission Torrent Port TCP
      # - "${QBIT_PORT_UDP:?err}:6881/udp"        # Transmission Torrent Port UDP
      - "3000:3000/tcp" # firefox
      - "3001:3001/tcp" # firefox
      - "6500:6500" #rdt
    volumes:
      - ${FOLDER_FOR_CONFIGS:?err}/gluetun:/gluetun
    healthcheck:
      test: ping -c 1 www.google.com || exit 1
      interval: 60s
      timeout: 20s
      retries: 5
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - TZ=${TIMEZONE:?err}
      - VPN_TYPE=${VPN_TYPE}
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER:?err}
      - OPENVPN_USER=${VPN_USERNAME}
      - OPENVPN_PASSWORD=${VPN_PASSWORD}
      - SERVER_REGIONS=${SERVER_REGIONS}
      - SERVER_NAMES=${SERVER_NAMES}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - SERVER_CITIES=${SERVER_CITIES}
      - SERVER_HOSTNAMES=${SERVER_HOSTNAMES}
      - FIREWALL_OUTBOUND_SUBNETS=${LOCAL_SUBNET:?err}
      # - OPENVPN_CUSTOM_CONFIG=${OPENVPN_CUSTOM_CONFIG}
      # - WIREGUARD_ENDPOINT_IP=${VPN_ENDPOINT_IP}
      # - WIREGUARD_ENDPOINT_PORT=${VPN_ENDPOINT_PORT}
      # - WIREGUARD_PUBLIC_KEY=${WIREGUARD_PUBLIC_KEY}
      # - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      # - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      # - WIREGUARD_PRESHARED_KEY=${WIREGUARD_PRESHARED_KEY}
      - HTTPPROXY=on
      - SHADOWSOCKS=on
      - UPDATER_PERIOD=24h
      - PORT_FORWARD_ONLY=true
      - VPN_PORT_FORWARDING=true
      - VPN_PORT_FORWARDING_STATUS_FILE=/gluetun/forwarded_port
      # - VPN_PORT_FORWARDING_PROVIDER=${VPN_PORT_FORWARDING_PROVIDER:?err}
      # - VPN_PORT_FORWARDING_USERNAME=${VPN_USERNAME}
      # - VPN_PORT_FORWARDING_PASSWORD=${VPN_PASSWORD}

###########################################################################
##  Docker Compose File:    Plex
##  Function:               Media Client
##  Documentation:          https://github.com/plexinc/pms-docker
###########################################################################
  plex:
    image: plexinc/pms-docker
    container_name: plex
    environment:
      - PLEX_CLAIM=${PLEX_CLAIM:?err}
    volumes:
      - ${FOLDER_FOR_CONFIGS:?err}/plex:/config
      - ${FOLDER_FOR_MEDIA:?err}/media:/data/media
    ports:
      - 32400:32400
      - 3005:3005
      - 8324:8324
      - 32469:32469
      - 1900:1900/udp
      - 32410:32410/udp
      - 32412:32412/udp
      - 32413:32413/udp
      - 32414:32414/udp
    # devices:
    #   - /dev/dri/renderD128:/dev/dri/renderD128
    # Hardware Acceleration
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "106" # Change this to match your "render" host group id and remove this comment
      - "44" # Change this to match your "video" host group id and remove this comment
    # End Hardware Acceleration
    restart: unless-stopped


# NOTE: Gluetun VPN container MUST ONLY connect to the media-network

    networks:
      - media-network

###########################################################################
##  Docker Compose File:  qBittorrent (LinuxServer.io)
##  Function:             Torrent Download Client
##  Documentation:        https://docs.linuxserver.io/images/docker-qbittorrent
##  Trackers:             https://github.com/ngosang/trackerslist/blob/master/trackers_all.txt
###########################################################################
  qbittorrent:
    image: linuxserver/qbittorrent:5.0.1-libtorrentv1
    container_name: qbittorrent
    restart: unless-stopped
    volumes:
      - ${FOLDER_FOR_CONFIGS:?err}/qbittorrent:/config
      - ${FOLDER_FOR_MEDIA:?err}:/data
    # depends_on:
    #   gluetun:
    #     condition: service_healthy
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}
      - WEBUI_PORT=${WEBUI_PORT_QBITTORRENT:?err}
      # - DOCKER_MODS=ghcr.io/gilbn/theme.park:qbittorrent
      # - TP_THEME=${TP_THEME:?err}

## Do Not Change Network for qBittorrent
## qBittorrent MUST always use a VPN / Secure Internet connection

    network_mode: "service:gluetun"

###########################################################################
##  Docker Compose File:  qbittorrent port forwarder
##  Function:             automatically update qbittorrent with the gluetun port-forward value
##  Documentation:        https://github.com/DoAndroids/vpn_downloads/blob/main/docker-compose.yml
###########################################################################
  qbittorrent-port:
    image: charlocharlie/qbittorrent-port-forward-file:latest
    network_mode: "service:gluetun"
    container_name: qbittorrent-port
    environment:
      - QBT_USERNAME=${QBT_USER}
      - QBT_PASSWORD=${QBT_PASS}
      - QBT_ADDR=http://localhost:${WEBUI_PORT_QBITTORRENT}
      - PORT_FILE=/config/gluetun/forwarded_port
    volumes:
      - ${FOLDER_FOR_CONFIGS:?err}/:/config:ro
    restart: unless-stopped
    depends_on:
      - qbittorrent
      - gluetun

###########################################################################
##  Docker Compose File:  qbittools
##  Function:             automatically run a 'reannounce' job on qBittorrent (for stalled torrents)
##  Documentation:        https://github.com/DoAndroids/vpn_downloads/blob/main/docker-compose.yml
###########################################################################
  qbittools:
    image: registry.gitlab.com/alexkm/qbittools
    network_mode: "service:gluetun"
    container_name: qbittools
    volumes:
      - ${FOLDER_FOR_CONFIGS:?err}/qbittorrent/config:/qBittorrent
    command: reannounce -C /qBittorrent/qBittorrent.conf
    restart: unless-stopped

