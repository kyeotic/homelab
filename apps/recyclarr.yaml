#################################################
### Sonarr
#################################################
sonarr:
  sonarr-main:
    base_url: !env_var SONARR_URL
    api_key: !env_var SONARR_API_KEY
    delete_old_custom_formats: true
    replace_existing_custom_formats: true
    quality_definition:
      type: series

    # We want to be able to categorize a series as either
    #
    # - 1080p Only: Don't upgrade these less quality-sensitive shows, 2160p is a waste of space
    # - 1080/4K: Allow 1080p but prefer 2160p is available
    # - 4k Only: Do not accept less than 4k, this shows requires quality
    #
    # So Create 3 Quality Profiles, one for each category
    quality_profiles:
      - name: 1080p Only
        upgrade:
          allowed: true
          until_quality: WEBDL-1080p
          # min_format_score: do not use this. since it blocks low scores
        qualities:
          - name: WEBDL-1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
          - name: Remux-1080p
            qualities:
              - Bluray-1080p
              - Bluray-1080p Remux
          - name: HDTV-1080p
            qualities:
              - HDTV-1080p
              - DVD
      - name: 1080p/4K
        upgrade:
          allowed: true
          until_quality: 4K Remux
        qualities:
          - name: 4K Remux
            qualities:
              - WEBRip-2160p
              - WEBDL-2160p
              - Bluray-2160p
              - Bluray-2160p Remux
          - name: HDTV-2160p
          - name: Remux-1080p
            qualities:
              - Bluray-1080p
              - Bluray-1080p Remux
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
              - HDTV-1080p
          - name: DVD
      - name: 4K
        upgrade:
          allowed: true
          until_quality: 4K Remux
        qualities:
          - name: 4K Remux
            qualities:
              - WEBRip-2160p
              - WEBDL-2160p
              - Bluray-2160p
              - Bluray-2160p Remux
          - name: HDTV-2160p

    # What is the rational for custom formats?
    # Lets make one and find out what it does
    custom_formats:
      # Common Formats
      - trash_ids:
          # HDR Formats
          - 27954b0a80aab882522a88a4d9eae1cd # Dolby SDR
          - 3a4127d8aa781b44120d907f2cd62627 # Hybrid
          - 6d0d8de7b57e35518ac0308b0ddf404e # DV = DoVi = Dolby Vision
          - 2b239ed870daba8126a53bd5dc8dc1c8 # DV HDR10Plus
          - 385e9e8581d33133c3961bdcdeffb7b4 # DV HDR10+ Boost

          # HQ Source
          - 9965a052eb87b0d10313b1cea89eb451 # Remux Tier 01
          - d6819cba26b1a6508138d25fb5e32293 # Remux Tier 02
          - c2216b7b8aa545dc1ce8388c618f8d57 # HD Bluray Tier 02
          - e6258996055b9fbab7e9cb2f75819294 # Web Tier 01
          - 58790d4e2fdcd9733aa7ae68ba2bb503 # Web Tier 02
          - d84935abd3f8556dcd51d4f27e22d0a6 # Web Tier 03
          - d0c516558625b04b363fa6c5c2c7cfd4 # Web Scene

          # Streaming Services
          - d660701077794679fd59e8bdf4ce3a29 # Amazon Prime Video
          - f67c9ca88f463a48346062e8ad07713f # Apple Tv
          - 89358767a60cc28783cdc3d0be9388a4 # Disney+

          # Misc
          - d7c747094a7c65f4c2de083c24899e8b # Freeleech

          # Unwanted
          - 9b27ab6498ec0f31a3353992e19434ca # DV (WEBDL)
          - 15a05bc7c1a36e2b57fd628f8977e2fc # AV1
          - 85c61753df5da1fb2aab6f2a47426b09 # BR Disk
          - 9c11cd3f07101cdba90a2d81cf0e56b4 # Low Quality
          - 9b64dff695c2115facf1b6ea59c9bd07 # x265 (no HDR/DV)
          # - 82d40da2bc6923f41e14394075dd4b03 # No-RlsGroup
          # - e1a997ddb54e3ecbfe06341ad323c458 # Obfuscated
          # - 06d66ab109d4d2eddb2794d21526d140 # Retags
          # - 1b3994c551cbb92a2c781af061f4ab44 # Scene
        assign_scores_to:
          - name: 1080p/4K
          - name: 4K
          - name: 1080p Only

#################################################
### Radarr
