services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v1.12.0

    container_name: mealie
    restart: always
    ports:
        - "3100:9000"
    deploy:
      resources:
        limits:
          memory: 1000M
    volumes:
      - ${FOLDER_FOR_CONFIGS:?err}/mealie:/app/data
    environment:
      # Set Backend ENV Variables Here
      ALLOW_SIGNUP: "false"
      PUID: ${PUID:?err}
      PGID: ${PGID:?err}
      TZ: ${TIMEZONE:?err}
      MAX_WORKERS: 1
      WEB_CONCURRENCY: 1
      BASE_URL: https://food.local.kye.dev
      SMTP_FROM_EMAIL: mealie.admin@kye.dev
      SMTP_HOST: smtp.mailbox.org
      SMTP_USER: tim@kye.dev
      SMTP_PASSWORD: ${SMTP_PASSWORD:?err}
