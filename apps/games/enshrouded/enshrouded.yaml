services:
  enshrouded:
    image: sknnr/enshrouded-dedicated-server:v2.0.4
    container_name: enshrouded
    restart: unless-stopped
    network_mode: "host"
    # cpuset caps ALL threads in the container to these cores, not just the
    # hot sim thread - Proton/Wine translation, asset streaming, and GC also
    # run auxiliary threads, so a single core (cpuset: "9") starved them and
    # made performance worse. Reserve a small range instead of one core so
    # the ~35 other containers on this host still can't crowd it out, but
    # auxiliary threads have room.
    # note: this host only has cores 0-6,9-11 online (7-8 are offline), so
    # the range must stay within that set.
    cpuset: "9-11"
    labels:
      # restart nightly at 4am: the server accumulates memory as terrain is
      # explored and degrades over long uptimes, see community discussion:
      # https://steamcommunity.com/app/1203620/discussions/0/4206993388793020551/
      ofelia.enabled: "true"
      ofelia.job-restart.nightly.schedule: "0 0 4 * * *"
    ports:
      - 15636:15636/udp
      - 15637:15637/udp
    volumes:
      - /mnt/nas/game-saves/enshrouded/savegame:/home/steam/enshrouded/savegame
      # externally-managed server config (EXTERNAL_CONFIG=1)
      - /mnt/nas/game-saves/enshrouded/config/enshrouded_server.json:/home/steam/enshrouded/enshrouded_server.json
      # persist SteamCMD + Proton prefix between container recreations
      - enshrouded-steamcmd:/home/steam/steamcmd
      - enshrouded-steam:/home/steam/Steam
    environment:
      # - PUID=1000
      # - PGID=10000
      # - PASSWORD=${PASSWORD:?err}
      # server settings below are ignored while EXTERNAL_CONFIG=1;
      # edit enshrouded_server.json directly instead
      - SERVER_NAME=${SERVER_NAME:?err}
      - SERVER_PASSWORD=${SERVER_PASSWORD:?err}
      - GAME_PORT=${GAME_PORT:?err}
      - QUERY_PORT=${QUERY_PORT:?err}
      - SERVER_SLOTS=${SERVER_SLOTS:?err}
      - SERVER_IP=${SERVER_IP:?err}
      - EXTERNAL_CONFIG=1

  ofelia:
    image: mcuadros/ofelia:latest
    container_name: enshrouded-ofelia
    restart: unless-stopped
    depends_on:
      - enshrouded
    command: daemon --docker
    environment:
      - TZ=America/Los_Angeles
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  enshrouded-steamcmd:
  enshrouded-steam:
