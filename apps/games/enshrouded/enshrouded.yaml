services:
  enshrouded:
    image: indifferentbroccoli/enshrouded-server-docker:v1.0.7-proton
    container_name: enshrouded
    restart: unless-stopped
    network_mode: "host"
    # the image waits up to 30s for the server to save and exit on SIGTERM
    stop_grace_period: 45s
    # the image starts Xvfb on :99 without clearing a stale /tmp/.X99-lock, so
    # after a `docker restart` (e.g. the nightly ofelia job) Xvfb exits and the
    # server hangs with no display. tmpfs wipes /tmp on every start.
    tmpfs:
      - /tmp:exec,mode=1777
    ports:
      - 15637:15637/udp
    volumes:
      # persist the installed game itself between container recreations
      - enshrouded-install:/home/steam/enshrouded
      # world: keep exactly one block uncommented. A mounted config file must
      # exist on the host first, or Docker creates a directory in its place.
      # --- pre-1.0 world (Foggy Loggins), needs GENERATE_SETTINGS=false
      # - /mnt/nas/game-saves/enshrouded/savegame:/home/steam/enshrouded/savegame
      # - /mnt/nas/game-saves/enshrouded/config/enshrouded_server.json:/home/steam/enshrouded/enshrouded_server.json
      # --- 1.0 world. The image always points saveDirectory at ./saves when
      # generating settings, so the saves are mounted there. The config is not
      # mounted while GENERATE_SETTINGS=true (the image replaces the file,
      # which fails on a file bind mount); it lives in enshrouded-install.
      - /mnt/nas/game-saves/enshrouded/v1/savegame:/home/steam/enshrouded/saves
      # - /mnt/nas/game-saves/enshrouded/v1/enshrouded_server.json:/home/steam/enshrouded/enshrouded_server.json
    environment:
      # the image chowns everything under /home/steam (including the NAS
      # mounts above) to this user on every start; 10000 matches the
      # existing save files
      - PUID=10000
      - PGID=10000
      # true: the image creates enshrouded_server.json if missing and sets
      # name/password/slots/port from the vars below on every start.
      # false: use enshrouded_server.json as-is
      - GENERATE_SETTINGS=true
      - SERVER_NAME=${SERVER_NAME:?err}
      - SERVER_PASSWORD=${SERVER_PASSWORD:?err}
      - QUERY_PORT=${QUERY_PORT:?err}
      - MAX_PLAYERS=${SERVER_SLOTS:?err}

  ofelia:
    image: mcuadros/ofelia:latest
    container_name: enshrouded-ofelia
    restart: unless-stopped
    depends_on:
      - enshrouded
    command: daemon --docker
    labels:
      # restart nightly at 4am: the server accumulates memory as terrain is
      # explored and degrades over long uptimes, see community discussion:
      # https://steamcommunity.com/app/1203620/discussions/0/4206993388793020551/
      # job-run labels must be on the ofelia container itself; only job-exec
      # labels are read from other containers
      ofelia.job-run.nightly.schedule: "0 0 4 * * *"
      ofelia.job-run.nightly.image: "docker:cli"
      ofelia.job-run.nightly.command: "docker restart enshrouded"
      ofelia.job-run.nightly.volume: "/var/run/docker.sock:/var/run/docker.sock"
    environment:
      - TZ=America/Los_Angeles
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  enshrouded-install:
