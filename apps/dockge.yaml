name: dockge
services:
  dockge:
    image: louislam/dockge:1
    container_name: dockge
    restart: unless-stopped
    ports:
      - 5001:5001
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - /mnt/app_config/dockge:/mnt/app_config/dockge
    environment:
      - DOCKGE_STACKS_DIR=/mnt/app_config/dockge
