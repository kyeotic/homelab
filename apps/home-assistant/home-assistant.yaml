services:
  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:stable"
    volumes:
      - /mnt/app_config/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    privileged: true
    network_mode: host
    ports:
      - 8123:8123
  code-server:
    container_name: homeassistant-code-server
    image: lscr.io/linuxserver/code-server:latest
    restart: unless-stopped
    environment:
      - PUID=0
      - PGID=0
      - TZ=America/Los_Angeles
      - PASSWORD=${CODE_SERVER_PASSWORD:?err}
      - DEFAULT_WORKSPACE=/config
    volumes:
      - /mnt/app_config/homeassistant:/config
    ports:
      - 12321:8443
  matter-server:
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    container_name: matter-server
    restart: unless-stopped
    network_mode: host
    volumes:
      - /mnt/app_config/ha-matter-server:/data
      - /run/dbus:/run/dbus:ro
    security_opt:
      - apparmor=unconfined
  # MCP server (https://github.com/homeassistant-ai/ha-mcp) so Claude can
  # control and configure HA. It has no login: the secret URL path is the
  # credential, so the endpoint is http://192.168.0.20:8086${HA_MCP_SECRET_PATH}.
  # The data dir must be owned by 999:999 (the image's mcpuser).
  ha-mcp:
    container_name: ha-mcp
    image: ghcr.io/homeassistant-ai/ha-mcp:latest
    command: ha-mcp-web
    restart: unless-stopped
    environment:
      - HOMEASSISTANT_URL=http://192.168.0.20:8123
      - HOMEASSISTANT_TOKEN=${HA_MCP_TOKEN:?err}
      - MCP_SECRET_PATH=${HA_MCP_SECRET_PATH:?err}
    volumes:
      - /mnt/app_config/ha-mcp:/home/mcpuser/.ha-mcp
    ports:
      - 8086:8086
