# Deploy (run from repo root): push this config to the docker host and sync.
# The remote file is removed first because its ZFS ACL can block root from
# truncating it in place.
#   ssh root@192.168.0.20 'rm -f /mnt/app_config/recyclarr/recyclarr.yml' && scp apps/servarr/recyclarr.yaml root@192.168.0.20:/mnt/app_config/recyclarr/recyclarr.yml && ssh root@192.168.0.20 'chown 1000:10000 /mnt/app_config/recyclarr/recyclarr.yml && chmod 664 /mnt/app_config/recyclarr/recyclarr.yml && docker exec recyclarr recyclarr sync'

#################################################
### Sonarr
#################################################
sonarr:
  sonarr-main:
    base_url: !env_var SONARR_URL
    api_key: !env_var SONARR_API_KEY
    delete_old_custom_formats: true
    replace_existing_custom_formats: true
    quality_definition:
      type: series

    # We want to be able to categorize a series as either
    #
    # - 1080p Only: Don't upgrade these less quality-sensitive shows, 2160p is a waste of space
    # - 1080/4K: Allow 1080p but prefer 2160p is available
    # - 4k Only: Do not accept less than 4k, this shows requires quality
    #
    # So Create 3 Quality Profiles, one for each category
    quality_profiles:
      - name: 1080p Only
        upgrade:
          allowed: true
          until_quality: WEBDL-1080p
          # min_format_score: do not use this. since it blocks low scores
        qualities:
          - name: WEBDL-1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
          - name: Remux-1080p
            qualities:
              - Bluray-1080p
              - Bluray-1080p Remux
          - name: HDTV-1080p
            qualities:
              - HDTV-1080p
              - DVD
      - name: 1080p/4K
        upgrade:
          allowed: true
          until_quality: 4K Remux
        qualities:
          - name: 4K Remux
            qualities:
              - WEBRip-2160p
              - WEBDL-2160p
              - Bluray-2160p
              - Bluray-2160p Remux
          - name: HDTV-2160p
          - name: Remux-1080p
            qualities:
              - Bluray-1080p
              - Bluray-1080p Remux
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
              - HDTV-1080p
          - name: DVD
      - name: 4K
        upgrade:
          allowed: true
          until_quality: 4K Remux
        qualities:
          - name: 4K Remux
            qualities:
              - WEBRip-2160p
              - WEBDL-2160p
              - Bluray-2160p
              - Bluray-2160p Remux
          - name: HDTV-2160p

    # What is the rational for custom formats?
    # Lets make one and find out what it does
    custom_formats:
      # ================================================================
      #  TUNABLE SCORE WEIGHTS  (edit the &anchor numbers below)
      # ----------------------------------------------------------------
      #  recyclarr has no standalone variables block, so the weights are
      #  YAML anchors (&name) defined on first use here in the sonarr
      #  section and reused (*name) in every profile AND in the Radarr
      #  section below. Edit a number once; it applies everywhere.
      #
      #    &primary   – dominant ranking key in a profile
      #    &secondary – tie-break key (sized to beat tiers/DV/audio)
      #    &dv_boost  – small nudge so Dolby Vision sits above plain HDR
      #    &audio_penalty – HD/lossless audio (Apple TV can't bitstream → transcodes)
      #
      #  Which key is PRIMARY flips per profile:
      #    4K profile       -> resolution PRIMARY, HDR SECONDARY
      #         4K HDR > 4K SDR > 1080p        (SDR accepted, far under HDR)
      #    1080p/4K profile -> HDR PRIMARY, resolution SECONDARY
      #         4K HDR > 1080p HDR > 4K SDR > 1080p SDR
      #
      #  Keep this hierarchy when tweaking (release-group tiers ~1950 are the floor):
      #     primary  > secondary + top_tier + dv_boost
      #     secondary > top_tier + dv_boost
      #  Maxed-out release ≈ primary + secondary + tier + dv_boost (~10k).
      # ================================================================

      # HDR — PRIMARY where HDR rules; SECONDARY in the 4K profile
      - trash_ids:
          - 505d871304820ba7106b693be6fe4a9e # HDR
        assign_scores_to:
          - name: 1080p Only
            score: &primary 5000
          - name: 1080p/4K
            score: *primary
          - name: 4K
            score: &secondary 2500
      # 2160p — PRIMARY in the 4K profile; SECONDARY in 1080p/4K
      - trash_ids:
          - 1bef6c151fa35093015b0bfef18279e5 # 2160p
        assign_scores_to:
          - name: 1080p/4K
            score: *secondary
          - name: 4K
            score: *primary
      # DV Boost — nudge Dolby Vision above plain HDR (within a tier)
      - trash_ids:
          - 7c3a61a9c6cb04f52f1544be6d44a026 # DV Boost
        assign_scores_to:
          - name: 1080p Only
            score: &dv_boost 250
          - name: 1080p/4K
            score: *dv_boost
          - name: 4K
            score: *dv_boost
      # HD/lossless audio — Apple TV (Plex) can't bitstream these → transcodes
      - trash_ids:
          - 0d7824bb924701997f874e7ff7d4844a # TrueHD ATMOS
          - 1808e4b9cee74e064dfae3f1db99dbfe # TrueHD
          - 9d00418ba386a083fbf4d58235fc37ef # DTS X
          - c429417a57ea8c41d57e6990a8b0033f # DTS-HD MA
          - cfa5fbd8f02a86fc55d8d223d06a5e1f # DTS-HD HRA
          - 851bd64e04c9374c51102be3dd9ae4cc # FLAC
          - 30f70576671ca933adbdcfc736a69718 # PCM
        assign_scores_to:
          - name: 1080p Only
            score: &audio_penalty -1000
          - name: 1080p/4K
            score: *audio_penalty
          - name: 4K
            score: *audio_penalty

      # Upscaled — releases advertising (AI) upscaling; effectively never grab
      - trash_ids:
          - 23297a736ca77c0fc8e70f8edd7ee56c # Upscaled
        assign_scores_to:
          - name: 1080p Only
            score: &upscaled_penalty -10000
          - name: 1080p/4K
            score: *upscaled_penalty
          - name: 4K
            score: *upscaled_penalty

      # Common Formats — guide-default scores (tiers, streaming, hybrid, unwanted)
      - trash_ids:
          - 3a4127d8aa781b44120d907f2cd62627 # Hybrid

          # HQ Source
          - 9965a052eb87b0d10313b1cea89eb451 # Remux Tier 01
          - d6819cba26b1a6508138d25fb5e32293 # Remux Tier 02
          - c2216b7b8aa545dc1ce8388c618f8d57 # HD Bluray Tier 02
          - e6258996055b9fbab7e9cb2f75819294 # Web Tier 01
          - 58790d4e2fdcd9733aa7ae68ba2bb503 # Web Tier 02
          - d84935abd3f8556dcd51d4f27e22d0a6 # Web Tier 03
          - d0c516558625b04b363fa6c5c2c7cfd4 # Web Scene

          # Streaming Services
          - d660701077794679fd59e8bdf4ce3a29 # Amazon Prime Video
          - f67c9ca88f463a48346062e8ad07713f # Apple Tv
          - 89358767a60cc28783cdc3d0be9388a4 # Disney+

          # Misc
          - d7c747094a7c65f4c2de083c24899e8b # Freeleech

          # Unwanted
          # (Profile-5 "DV w/o HDR fallback" penalty removed — the LG plays DV natively)
          - 15a05bc7c1a36e2b57fd628f8977e2fc # AV1
          - 85c61753df5da1fb2aab6f2a47426b09 # BR Disk
          - 9c11cd3f07101cdba90a2d81cf0e56b4 # Low Quality
          - 9b64dff695c2115facf1b6ea59c9bd07 # x265 (no HDR/DV)
          # - 82d40da2bc6923f41e14394075dd4b03 # No-RlsGroup
          # - e1a997ddb54e3ecbfe06341ad323c458 # Obfuscated
          # - 06d66ab109d4d2eddb2794d21526d140 # Retags
          # - 1b3994c551cbb92a2c781af061f4ab44 # Scene
        assign_scores_to:
          - name: 1080p/4K
          - name: 4K
          - name: 1080p Only

#################################################
### Radarr
#################################################
radarr:
  radarr-main:
    base_url: !env_var RADARR_URL
    api_key: !env_var RADARR_API_KEY
    delete_old_custom_formats: true
    replace_existing_custom_formats: true
    quality_definition:
      type: movie

    quality_profiles:
      - name: 1080p Only
        upgrade:
          allowed: true
          until_quality: WEBDL-1080p
          # min_format_score: do not use this. since it blocks low scores
        qualities:
          - name: WEBDL-1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
          - name: Remux-1080p
            qualities:
              - Bluray-1080p
              - Remux-1080p
          - name: HDTV-1080p
            qualities:
              - HDTV-1080p
              - DVD
      - name: 1080p/4K
        upgrade:
          allowed: true
          until_quality: 4K Remux
        qualities:
          - name: 4K Remux
            qualities:
              - WEBRip-2160p
              - WEBDL-2160p
              - Bluray-2160p
              - Remux-2160p
          - name: HDTV-2160p
          - name: Remux-1080p
            qualities:
              - Bluray-1080p
              - Remux-1080p
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
              - HDTV-1080p
          - name: DVD
      - name: 4K
        upgrade:
          allowed: true
          until_quality: 4K Remux
        qualities:
          - name: 4K Remux
            qualities:
              - WEBRip-2160p
              - WEBDL-2160p
              - Bluray-2160p
              - Remux-2160p
          - name: HDTV-2160p
    custom_formats:
      # Common
      - trash_ids:
        # Profile-5 "DV w/o HDR fallback" penalty removed — the LG plays DV natively
        # (HDR / 2160p / DV Boost / audio use the shared anchors, in the ranking block below)
        # HQ Release Groups
        - 3a3ff47579026e76d6504ebea39390de # Remux Tier 01
        - 9f98181fe5a3fbeb0cc29340da2a468a # Remux Tier 02
        - 8baaf0b3142bf4d94c42a724f034e27a # Remux Tier 03
        - c20f169ef63c5f40c2def54abaf4438e # WEB Tier 01
        - 403816d65392c79236dcb6dd591aeda4 # WEB Tier 02
        - af94e0fe497124d1f9ce732069ec8c3b # WEB Tier 03
        # Misc
        - 0f12c086e289cf966fa5948eac571f44 # Hybrid
        # Unwanted
        - cae4ca30163749b891686f95532519bd # AV1
        - ed38b889b31be83fda192888e2286d83 # BR Disk
        - 90a6f9a284dff5103f6346090e6280c8 # Low QUality
        - 839bea857ed2c0a8e084f3cbdbd65ecb # x265 (no HDR/DV)
        assign_scores_to:
          - name: 1080p/4K
          - name: 4K
          - name: 1080p Only

      # HD/lossless audio — Apple TV (Plex) can't bitstream these, so they force
      # an audio transcode. Penalize so DD+/DD releases (which pass through) win.
      # DV/video scoring is untouched. Tune score: -1000 = strongly avoid,
      # raise toward 0 for a gentler nudge, -10000 to effectively never pick.
      - trash_ids:
        - 496f355514737f7d83bf7aa4d24f8169 # TrueHD ATMOS
        - 3cafb66171b47f226146a0770576870f # TrueHD
        - 2f22d89048b01681dde8afe203bf2e95 # DTS X
        - dcf3ec6938fa32445f590a4da84256cd # DTS-HD MA
        - 8e109e50e0a0b83a5098b056e13bf6db # DTS-HD HRA
        - a570d4a0e56a2874b64e5bfa55202a1b # FLAC
        - e7c2fcae07cbada050a0af3357491d7b # PCM
        assign_scores_to:
          - name: 1080p Only
            score: *audio_penalty
          - name: 1080p/4K
            score: *audio_penalty
          - name: 4K
            score: *audio_penalty

      # Upscaled — releases advertising (AI) upscaling; effectively never grab
      - trash_ids:
        - bfd8eb01832d646a0a89c4deb46f8564 # Upscaled
        assign_scores_to:
          - name: 1080p Only
            score: *upscaled_penalty
          - name: 1080p/4K
            score: *upscaled_penalty
          - name: 4K
            score: *upscaled_penalty


      # 4K Only
      - trash_ids:
        - 4d74ac4c4db0b64bff6ce0cffef99bf0 # UHD Bluray Tier 01
        - a58f517a70193f8e578056642178419d # UHD Bluray Tier 02
        - e71939fae578037e7aed3ee219bbe7c1 # UHD Bluray Tier 03
        assign_scores_to:
          - name: 1080p/4K
          - name: 4K

      # 1080p Only
      - trash_ids:
        - ed27ebfef2f323e964fb1f61391bcb35 # HD Bluray Tier 01
        - c20c8647f2746a1f4c4262b0fbbeeeae # HD Bluray Tier 02
        - 5608c71bcebba0a5e666223bae8c9227 # HD Bluray Tier 03
        assign_scores_to:
          - name: 1080p/4K
          - name: 1080p Only

      # ============================================================
      #  Resolution + HDR ranking  (weights = shared anchors)
      #  Edit the numbers in the TUNABLE SCORE WEIGHTS block at the top of
      #  the sonarr section; these *aliases reuse them.
      # ============================================================
      - trash_ids:
        - b337d6812e06c200ec9a2d3cfa9d20a7 # DV Boost
        assign_scores_to:
          - name: 1080p Only
            score: *dv_boost
          - name: 1080p/4K
            score: *dv_boost
          - name: 4K
            score: *dv_boost
      - trash_ids:
        - 493b6d1dbec3c3364c59d7607f7e3405 # HDR
        assign_scores_to:
          - name: 1080p Only
            score: *primary
          - name: 1080p/4K
            score: *primary
          - name: 4K
            score: *secondary
      - trash_ids:
        - fb392fb0d61a010ae38e49ceaa24a1ef # 2160p
        assign_scores_to:
          - name: 1080p/4K
            score: *secondary
          - name: 4K
            score: *primary