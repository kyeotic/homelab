---
version: "3"
services:
  syncthing:
    image: syncthing/syncthing:2.1.1
    container_name: syncthing
    hostname: kye-sync
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - /mnt/nas/drive:/var/syncthing
    ports:
      - 8384:8384           # Web UI
      - 22000:22000/tcp     # TCP file transfers
      - 22000:22000/udp     # QUIC file transfers
      - 21027:21027/udp     # Receive local discovery broadcasts
    network_mode: host
    restart: unless-stopped
    labels:
      kuma.syncthing.http.name: "Syncthing"
      kuma.syncthing.http.url: "http://192.168.0.20:8384/rest/noauth/health"
      kuma.syncthing.http.notification_id_list: '{"1": true}'
