---
# Restore LXC containers from restic backups

- name: check for existing vzdump files
  find:
    paths: /tank/container-backups/dump
    patterns: "vzdump-lxc-*.tar.zst"
    excludes: "*.notes,*.log"
  register: existing_dumps
  failed_when: false

- name: restore container backups from restic
  shell: |
    echo "Starting restic restore from remote backup..."
    resticprofile --verbose restore latest:/tank/container-backups/dump --target /tank/container-backups/dump
    echo "Restic restore complete"
  register: restic_restore
  when: existing_dumps.files | length == 0
  changed_when: restic_restore.rc == 0
  async: 3600
  poll: 10

- name: skip restore - local backup files exist
  debug:
    msg: "Skipping restic restore - {{ existing_dumps.files | length }} backup files already exist locally"
  when: existing_dumps.files | length > 0

- name: find vzdump backup files after restore
  find:
    paths: /tank/container-backups/dump
    patterns: "vzdump-lxc-*.tar.zst"
    excludes: "*.notes,*.log"
  register: vzdump_files

- name: get list of existing container IDs
  shell: pct list | awk 'NR>1 {print $1}'
  register: existing_containers
  changed_when: false

- name: restore containers from vzdump backups
  shell: |
    CTID=$(echo "{{ item.path | basename }}" | sed -n 's/vzdump-lxc-\([0-9]*\)-.*/\1/p')
    pct restore $CTID "{{ item.path }}" --storage local-lvm
    echo "restored CT $CTID"
  loop: "{{ vzdump_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: (item.path | basename | regex_replace('^vzdump-lxc-([0-9]+)-.*', '\\1')) not in existing_containers.stdout_lines
  register: restore_result
  changed_when: "'restored' in restore_result.stdout"
