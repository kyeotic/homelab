---
# Create Caddy LXC container

- name: create and configure Caddy LXC
  ansible.builtin.include_role:
    name: lxc-create
  vars:
    lxc_vmid: "{{ caddy_lxc_vmid }}"
    lxc_hostname: "{{ caddy_lxc_hostname }}"
    lxc_cores: "{{ caddy_lxc_cores }}"
    lxc_memory: "{{ caddy_lxc_memory }}"
    lxc_swap: "{{ caddy_lxc_swap }}"
    lxc_disk: "{{ caddy_lxc_disk }}"
    lxc_storage: "{{ caddy_lxc_storage }}"
    lxc_bridge: "{{ caddy_lxc_bridge }}"
    lxc_ip: "{{ caddy_lxc_ip }}"
    lxc_gateway: "{{ caddy_lxc_gateway }}"
    lxc_template_name: "{{ caddy_lxc_template_name }}"
    lxc_template: "{{ caddy_lxc_template }}"
    lxc_onboot: "{{ caddy_lxc_onboot }}"
    lxc_unprivileged: "{{ caddy_lxc_unprivileged }}"
    lxc_features: "{{ caddy_lxc_features }}"
    lxc_mounts: "{{ caddy_lxc_mounts }}"

- name: install Docker via official install script
  ansible.builtin.shell: |
    pct exec {{ effective_vmid }} -- sh -c 'curl -fsSL https://get.docker.com | sh'
  when: not lxc_exists

- name: finish SSH setup for Caddy LXC
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/../lxc-create/tasks/ssh-setup.yml"
  vars:
    lxc_ip: "{{ caddy_lxc_ip }}"
