---
# Create and configure Docker LXC container

- name: create and configure Docker LXC
  ansible.builtin.include_role:
    name: lxc-create
  vars:
    lxc_vmid: "{{ docker_lxc_vmid }}"
    lxc_hostname: "{{ docker_lxc_hostname }}"
    lxc_cores: "{{ docker_lxc_cores }}"
    lxc_memory: "{{ docker_lxc_memory }}"
    lxc_swap: "{{ docker_lxc_swap }}"
    lxc_disk: "{{ docker_lxc_disk }}"
    lxc_storage: "{{ docker_lxc_storage }}"
    lxc_bridge: "{{ docker_lxc_bridge }}"
    lxc_ip: "{{ docker_lxc_ip }}"
    lxc_gateway: "{{ docker_lxc_gateway }}"
    lxc_template_name: "{{ docker_lxc_template_name }}"
    lxc_template: "{{ docker_lxc_template }}"
    lxc_onboot: "{{ docker_lxc_onboot }}"
    lxc_unprivileged: "{{ docker_lxc_unprivileged }}"
    lxc_features: "{{ docker_lxc_features }}"
    lxc_mounts: "{{ docker_lxc_mounts }}"
    lxc_packages: []
    lxc_conf_lines: "{{ docker_lxc_conf_lines }}"

- name: finish SSH setup for Docker LXC
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/../lxc-create/tasks/ssh-setup.yml"
  vars:
    lxc_ip: "{{ docker_lxc_ip }}"
