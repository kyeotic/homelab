---
# Create AdGuard LXC container

- name: List all LXC containers
  command: pct list
  register: pct_list
  changed_when: false

- name: Find existing container by hostname
  set_fact:
    existing_lxc_vmid: >-
      {{ pct_list.stdout_lines
         | select('search', '\s' + adguard_lxc_hostname + '\s*$')
         | first | default('')
         | regex_replace('^\s*(\d+)\s.*', '\1') }}

- name: Set effective VMID
  set_fact:
    effective_vmid: "{{ existing_lxc_vmid if existing_lxc_vmid else adguard_lxc_vmid | string }}"
    lxc_exists: "{{ existing_lxc_vmid | length > 0 }}"

- name: Show detected LXC status
  debug:
    msg: "{{ 'Found existing LXC \"' + adguard_lxc_hostname + '\" with VMID ' + effective_vmid if lxc_exists else 'No existing LXC found, will create with VMID ' + effective_vmid }}"

- name: Create AdGuard LXC container
  when: not lxc_exists
  block:
    - name: Check if template exists
      command: pveam list local
      register: template_list
      changed_when: false

    - name: Download container template
      when: adguard_lxc_template_name not in template_list.stdout
      command: pveam download local {{ adguard_lxc_template_name }}

    - name: Verify root password is set
      fail:
        msg: "adguard_lxc_root_password must be set in vault"
      when: not adguard_lxc_root_password

    - name: Create LXC container
      command: >
        pct create {{ effective_vmid }} {{ adguard_lxc_template }}
        --hostname {{ adguard_lxc_hostname }}
        --cores {{ adguard_lxc_cores }}
        --memory {{ adguard_lxc_memory }}
        --swap {{ adguard_lxc_swap }}
        --rootfs {{ adguard_lxc_storage }}:{{ adguard_lxc_disk }}
        --net0 name=eth0,bridge={{ adguard_lxc_bridge }},firewall=1,ip={{ adguard_lxc_ip }},gw={{ adguard_lxc_gateway }},type=veth
        --onboot {{ adguard_lxc_onboot | ternary('1', '0') }}
        --unprivileged {{ adguard_lxc_unprivileged | ternary('1', '0') }}
        --features {{ adguard_lxc_features }}
        --password {{ adguard_lxc_root_password }}
      register: lxc_create
      no_log: true

    - name: Add mount points
      command: >
        pct set {{ effective_vmid }}
        --mp{{ idx }} {{ item.host }},mp={{ item.container }}
      loop: "{{ adguard_lxc_mounts }}"
      loop_control:
        index_var: idx

- name: Clear old SSH host key from known_hosts
  delegate_to: localhost
  command: ssh-keygen -f ~/.ssh/known_hosts -R "{{ adguard_lxc_ip | regex_replace('/.*', '') }}"
  when: not lxc_exists
  failed_when: false
  changed_when: false

- name: Get current LXC status
  command: pct status {{ effective_vmid }}
  register: current_status
  changed_when: false

- name: Start AdGuard LXC
  command: pct start {{ effective_vmid }}
  register: lxc_started
  when: "'running' not in current_status.stdout"

- name: Wait for container to be ready
  pause:
    seconds: 5
  when: lxc_started.changed | default(false)

- name: Install curl and openssh-server in container
  shell: |
    pct exec {{ effective_vmid }} -- apt-get update && pct exec {{ effective_vmid }} -- apt-get install -y curl openssh-server
  when: not lxc_exists

- name: Install AdGuard Home via official install script
  shell: |
    pct exec {{ effective_vmid }} -- sh -c 'curl -s -S -L https://raw.githubusercontent.com/AdguardTeam/AdGuardHome/master/scripts/install.sh | sh -s -- -v'
  when: not lxc_exists

- name: Create systemd override directory for AdGuard Home
  shell: |
    pct exec {{ effective_vmid }} -- mkdir -p /etc/systemd/system/AdGuardHome.service.d
  when: not lxc_exists

- name: Create systemd override to use config on persistent mount
  shell: |
    pct exec {{ effective_vmid }} -- sh -c 'cat > /etc/systemd/system/AdGuardHome.service.d/override.conf << EOF
    [Service]
    ExecStart=
    ExecStart=/opt/AdGuardHome/AdGuardHome -s run -c /mnt/adguard/AdGuardHome.yaml
    EOF'
  when: not lxc_exists

- name: Reload systemd and restart AdGuard Home
  shell: |
    pct exec {{ effective_vmid }} -- systemctl daemon-reload && pct exec {{ effective_vmid }} -- systemctl restart AdGuardHome
  when: not lxc_exists

- name: Install SSH key sync script via pct exec
  shell: |
    pct exec {{ effective_vmid }} -- sh -c 'curl -fsSL https://ssh-keys.kye.dev/install | sh'
  register: ssh_install
  changed_when: true
  when: not lxc_exists

- name: Sync SSH keys via pct exec
  shell: |
    pct exec {{ effective_vmid }} -- /usr/local/bin/sync-ssh-keys
  register: ssh_sync
  changed_when: "'updated' in ssh_sync.stdout"
  when: not lxc_exists

- name: Wait for AdGuard LXC to be reachable via SSH
  wait_for:
    host: "{{ adguard_lxc_ip | regex_replace('/.*', '') }}"
    port: 22
    delay: 5
    timeout: 120
  when: lxc_started.changed | default(false)

- name: Add new container's host key to known_hosts
  delegate_to: localhost
  shell: |
    for i in 1 2 3 4 5; do
      ssh-keyscan -H "{{ adguard_lxc_ip | regex_replace('/.*', '') }}" >> ~/.ssh/known_hosts && exit 0
      sleep 2
    done
    exit 1
  when: not lxc_exists
  changed_when: true
