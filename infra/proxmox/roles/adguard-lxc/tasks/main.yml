---
# Create AdGuard LXC container

- name: create and configure AdGuard LXC
  ansible.builtin.include_role:
    name: lxc-create
  vars:
    lxc_vmid: "{{ adguard_lxc_vmid }}"
    lxc_hostname: "{{ adguard_lxc_hostname }}"
    lxc_cores: "{{ adguard_lxc_cores }}"
    lxc_memory: "{{ adguard_lxc_memory }}"
    lxc_swap: "{{ adguard_lxc_swap }}"
    lxc_disk: "{{ adguard_lxc_disk }}"
    lxc_storage: "{{ adguard_lxc_storage }}"
    lxc_bridge: "{{ adguard_lxc_bridge }}"
    lxc_ip: "{{ adguard_lxc_ip }}"
    lxc_gateway: "{{ adguard_lxc_gateway }}"
    lxc_template_name: "{{ adguard_lxc_template_name }}"
    lxc_template: "{{ adguard_lxc_template }}"
    lxc_onboot: "{{ adguard_lxc_onboot }}"
    lxc_unprivileged: "{{ adguard_lxc_unprivileged }}"
    lxc_features: "{{ adguard_lxc_features }}"
    lxc_mounts: "{{ adguard_lxc_mounts }}"

- name: install AdGuard Home via official install script
  ansible.builtin.shell: |
    pct exec {{ effective_vmid }} -- sh -c 'curl -s -S -L https://raw.githubusercontent.com/AdguardTeam/AdGuardHome/master/scripts/install.sh | sh -s -- -v'
  when: not lxc_exists

- name: create systemd override directory for AdGuard Home
  ansible.builtin.shell: |
    pct exec {{ effective_vmid }} -- mkdir -p /etc/systemd/system/AdGuardHome.service.d
  when: not lxc_exists

- name: create systemd override to use config on persistent mount
  ansible.builtin.shell: |
    pct exec {{ effective_vmid }} -- sh -c 'cat > /etc/systemd/system/AdGuardHome.service.d/override.conf << EOF
    [Service]
    ExecStart=
    ExecStart=/opt/AdGuardHome/AdGuardHome -s run -c /mnt/adguard/AdGuardHome.yaml
    EOF'
  when: not lxc_exists

- name: reload systemd and restart AdGuard Home
  ansible.builtin.shell: |
    pct exec {{ effective_vmid }} -- systemctl daemon-reload && pct exec {{ effective_vmid }} -- systemctl restart AdGuardHome
  when: not lxc_exists

- name: finish SSH setup for AdGuard LXC
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/../lxc-create/tasks/ssh-setup.yml"
  vars:
    lxc_ip: "{{ adguard_lxc_ip }}"
