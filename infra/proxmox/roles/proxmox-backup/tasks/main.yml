---
# Proxmox scheduled backup job for containers

- name: get existing backup jobs
  command: pvesh get /cluster/backup --output-format json
  register: backup_jobs_raw
  changed_when: false

- name: parse backup jobs
  set_fact:
    backup_jobs: "{{ backup_jobs_raw.stdout | from_json }}"

- name: check if backup job exists for our vmids
  set_fact:
    backup_job_exists: "{{ backup_jobs | selectattr('vmid', 'defined') | selectattr('vmid', 'equalto', backup_vmids) | list | length > 0 }}"

- name: create backup job
  command: >
    pvesh create /cluster/backup
    --schedule "{{ backup_schedule }}"
    --compress {{ backup_compress }}
    --mode {{ backup_mode }}
    --storage {{ backup_storage }}
    --vmid {{ backup_vmids }}
    --prune-backups keep-last={{ backup_keep_last }}
    --notes-template "{{ backup_notes_template }}"
    --notification-mode notification-system
    --enabled 1
  when: not backup_job_exists
