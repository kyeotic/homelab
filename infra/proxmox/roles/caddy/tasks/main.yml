---
# Caddy reverse proxy setup

- name: ensure caddy directory exists
  tags: [setup-caddy]
  file:
    path: /root/caddy
    state: directory
    mode: '0755'

- name: sync Dockerfile
  tags: [setup-caddy]
  copy:
    src: ../../../caddy/Dockerfile
    dest: /root/caddy/Dockerfile
    mode: '0644'
  register: dockerfile_sync

- name: sync compose.yaml
  tags: [setup-caddy]
  copy:
    src: ../../../caddy/compose.yaml
    dest: /root/caddy/compose.yaml
    mode: '0644'
  register: compose_sync

- name: build caddy image
  tags: [setup-caddy]
  command:
    cmd: docker compose build
    chdir: /root/caddy
  when: dockerfile_sync.changed or compose_sync.changed

- name: create env file with secrets
  tags: [setup-caddy]
  copy:
    content: |
      AWS_ACCESS_KEY={{ aws_access_key }}
      AWS_ACCESS_SECRET={{ aws_access_secret }}
    dest: /root/caddy/.env
    mode: '0600'

- name: sync Caddyfile
  tags: [setup-caddy, sync, sync-caddy]
  copy:
    src: ../../../caddy/Caddyfile
    dest: /root/caddy/Caddyfile
    mode: '0644'
  register: caddyfile_sync

- name: ensure caddy container is running
  tags: [setup-caddy]
  command:
    cmd: docker compose up -d
    chdir: /root/caddy
  changed_when: false

- name: reload caddy config
  tags: [setup-caddy, sync, sync-caddy]
  command:
    cmd: docker compose exec -T -w /etc/caddy caddy caddy reload
    chdir: /root/caddy
  when: caddyfile_sync.changed
