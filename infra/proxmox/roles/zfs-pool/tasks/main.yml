---
# ZFS Pool setup
# - Skips if pool already exists
# - Prompts for action if pool doesn't exist: import, create, test, or skip

- name: check if zfs pool exists
  command: zpool list {{ zfs_pool_name }}
  register: pool_check
  failed_when: false
  changed_when: false

- name: pool already exists
  debug:
    msg: "ZFS pool '{{ zfs_pool_name }}' already exists and is mounted"
  when: pool_check.rc == 0

- name: check for importable pools
  command: zpool import
  register: importable_pools
  failed_when: false
  changed_when: false
  when: pool_check.rc != 0

- name: prompt for zfs pool action
  pause:
    prompt: |

      ZFS pool '{{ zfs_pool_name }}' does not exist.

      Available pools to import:
      {{ importable_pools.stdout | default('(none found)') }}

      Choose an action:
        [import] - Import existing pool from external drives
        [create] - Create new pool with datasets and permissions (configure zfs_pool_disks first)
        [test]   - Create a test pool using sparse files (for testing only)
        [skip]   - Skip ZFS setup (tasks depending on pool will fail)

      Enter choice [import/create/test/skip]
  register: zfs_action
  when: pool_check.rc != 0

# --- Import existing pool ---
- name: import existing zfs pool
  command: zpool import {{ zfs_pool_name }}
  when:
    - pool_check.rc != 0
    - zfs_action.user_input | lower == 'import'

# --- Create real pool ---
- name: validate pool disks are configured
  fail:
    msg: "zfs_pool_disks must be set to create a real pool. Configure in inventory or group_vars."
  when:
    - pool_check.rc != 0
    - zfs_action.user_input | lower == 'create'
    - zfs_pool_disks | length == 0

- name: create zfs pool
  command: >
    zpool create
    -o ashift={{ zfs_pool_ashift }}
    {{ zfs_pool_name }}
    {{ zfs_pool_type }}
    {{ zfs_pool_disks | join(' ') }}
  when:
    - pool_check.rc != 0
    - zfs_action.user_input | lower == 'create'
    - zfs_pool_disks | length > 0

# --- Create test pool ---
- name: create test pool directory
  file:
    path: /tmp/zfs-test
    state: directory
    mode: '0755'
  when:
    - pool_check.rc != 0
    - zfs_action.user_input | lower == 'test'

- name: create sparse file for test pool
  command: truncate -s {{ zfs_test_pool_size }} /tmp/zfs-test/disk.img
  args:
    creates: /tmp/zfs-test/disk.img
  when:
    - pool_check.rc != 0
    - zfs_action.user_input | lower == 'test'

- name: create test zfs pool
  command: zpool create {{ zfs_pool_name }} /tmp/zfs-test/disk.img
  when:
    - pool_check.rc != 0
    - zfs_action.user_input | lower == 'test'

# --- Skip ---
- name: skipping zfs setup
  debug:
    msg: "Skipping ZFS pool setup. Tasks depending on /{{ zfs_pool_name }} may fail."
  when:
    - pool_check.rc != 0
    - zfs_action.user_input | lower == 'skip'

# --- Configure datasets (runs after create, test, or import) ---
- name: configure datasets and permissions
  when:
    - pool_check.rc != 0
    - zfs_action.user_input | default('skip') | lower in ['create', 'test', 'import']
  block:
    # Create NAS user and group
    - name: create nas group
      group:
        name: "{{ nas_group }}"
        gid: "{{ nas_gid }}"
        state: present

    - name: create nas user
      user:
        name: "{{ nas_user }}"
        uid: "{{ nas_uid }}"
        group: "{{ nas_group }}"
        shell: /bin/bash
        create_home: yes
        state: present

    # Create datasets
    - name: create zfs datasets
      community.general.zfs:
        name: "{{ zfs_pool_name }}/{{ item.name }}"
        state: present
        extra_zfs_properties: "{{ item.properties | default({}) }}"
      loop: "{{ zfs_datasets }}"
      loop_control:
        label: "{{ zfs_pool_name }}/{{ item.name }}"

    # Set root dataset properties
    - name: set pool root properties
      command: zfs set aclmode=passthrough aclinherit=passthrough {{ zfs_pool_name }}
      changed_when: false

    # Set dataset ownership and permissions
    - name: set dataset ownership
      file:
        path: "/{{ zfs_pool_name }}/{{ item.name }}"
        owner: "{{ item.owner | default('root') }}"
        group: "{{ item.group | default('root') }}"
        mode: "{{ item.mode | default('0755') }}"
        state: directory
      loop: "{{ zfs_datasets }}"
      loop_control:
        label: "{{ zfs_pool_name }}/{{ item.name }}"

    # Set ACLs on datasets (access ACL)
    - name: set dataset access ACLs
      acl:
        path: "/{{ zfs_pool_name }}/{{ item.name }}"
        entity: "{{ (acl_entry.split(':')[1]) }}"
        etype: "{{ 'group' if acl_entry.startswith('g:') else 'user' }}"
        permissions: "{{ acl_entry.split(':')[2] }}"
        state: present
      loop: "{{ zfs_datasets | selectattr('acl', 'defined') | list }}"
      loop_control:
        label: "{{ zfs_pool_name }}/{{ item.name }}"
      vars:
        acl_entry: "{{ item.acl[0] }}"
      when: item.acl | default([]) | length > 0

    # Set default ACLs on datasets (inherited by new files/directories)
    - name: set dataset default ACLs
      acl:
        path: "/{{ zfs_pool_name }}/{{ item.name }}"
        entity: "{{ (acl_entry.split(':')[1]) }}"
        etype: "{{ 'group' if acl_entry.startswith('g:') else 'user' }}"
        permissions: "{{ acl_entry.split(':')[2] }}"
        default: yes
        state: present
      loop: "{{ zfs_datasets | selectattr('acl', 'defined') | list }}"
      loop_control:
        label: "{{ zfs_pool_name }}/{{ item.name }}"
      vars:
        acl_entry: "{{ item.acl[0] }}"
      when: item.acl | default([]) | length > 0
