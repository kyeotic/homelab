---
# ZFS pool configuration
zfs_pool_name: tank
zfs_test_pool_size: 30G

# Pool creation settings (for 'create' action)
# Set these in inventory or group_vars for your actual disks
zfs_pool_type: raidz1
zfs_pool_disks: []
#  - /dev/disk/by-id/wwn-0x5002538f33112e23
#  - /dev/disk/by-id/wwn-0x5002538f33112e6f
#  - /dev/disk/by-id/wwn-0x5002538f33112e27
#  - /dev/disk/by-id/ata-TEAM_T2532TB_TPBF2308210040501232
zfs_pool_ashift: 12

# Dataset definitions
zfs_datasets:
  - name: apps
    properties:
      acltype: posix
      aclmode: passthrough
      aclinherit: passthrough
    owner: "{{ nas_user }}"
    group: "{{ nas_group }}"
    mode: "0775"
    acl:
      - "g:{{ nas_group }}:rwx"

  - name: media_root
    properties:
      acltype: posix
      aclmode: passthrough
      aclinherit: passthrough
    owner: "{{ nas_user }}"
    group: "{{ nas_group }}"
    mode: "0775"
    acl:
      - "g:{{ nas_group }}:rwx"

  - name: nas
    properties:
      acltype: posix
      aclmode: passthrough
      aclinherit: passthrough
    owner: "{{ nas_user }}"
    group: "{{ nas_group }}"
    mode: "0775"
    acl:
      - "g:{{ nas_group }}:rwx"

  - name: os
    properties:
      acltype: posix
      aclinherit: discard
      xattr: "on"
    owner: root
    group: root
    mode: "0755"
