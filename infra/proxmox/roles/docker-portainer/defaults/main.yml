---
# Docker and Portainer configuration

# Portainer settings
portainer_data_path: /mnt/app_config/portainer
portainer_image: portainer/portainer-ce:latest
portainer_container_name: portainer
portainer_https_port: 9443
portainer_tunnel_port: 8000
bws_access_token: "{{ vault_bws_access_token }}"
portainer_redeploy_stacks: true

# Docker settings
docker_log_driver: journald
