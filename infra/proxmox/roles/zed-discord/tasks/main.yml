---
# ZED Discord notifications for ZFS errors

- name: deploy discord notification script
  ansible.builtin.template:
    src: discord-notify.sh.j2
    dest: /etc/zfs/zed.d/discord-notify.sh
    mode: '0755'
    owner: root
    group: root
  notify: restart zed

- name: configure zed notification interval
  ansible.builtin.lineinfile:
    path: /etc/zfs/zed.d/zed.rc
    regexp: '^#?ZED_NOTIFY_INTERVAL_SECS='
    line: 'ZED_NOTIFY_INTERVAL_SECS={{ zed_notify_interval_secs }}'
  notify: restart zed

- name: ensure zed is enabled
  ansible.builtin.systemd:
    name: zfs-zed
    enabled: yes
    state: started
