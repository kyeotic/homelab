---
# SSH key sync for LXC containers
# The sync script fetches managed keys from https://ssh-keys.kye.dev

- name: install ssh-keys sync script on all containers
  tags: [setup-container-ssh, setup-docker]
  ansible.builtin.shell: |
    SCRIPT_PATH="/usr/local/bin/sync-ssh-keys"
    FAILED=0

    install_on_container() {
      CTID=$1
      STATUS=$(pct status $CTID | awk '{print $2}')

      if [ "$STATUS" = "running" ]; then
        if ! pct exec $CTID -- test -f "$SCRIPT_PATH"; then
          OUTPUT=$(pct exec $CTID -- sh -c 'curl -fsSL https://ssh-keys.kye.dev/install | sh' 2>&1)
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 0 ] && pct exec $CTID -- test -f "$SCRIPT_PATH"; then
            echo "installed:$CTID"
          else
            echo "failed:$CTID (exit=$EXIT_CODE): $OUTPUT" >&2
            return 1
          fi
        fi
      else
        echo "skipped:$CTID (not running)"
      fi
    }

    for CTID in $(pct list | awk 'NR>1 {print $1}'); do
      install_on_container $CTID || FAILED=1
    done
    exit $FAILED

  register: install_result
  changed_when: "'installed:' in install_result.stdout"

- name: sync ssh keys on all containers
  tags: [setup-container-ssh, setup-docker, sync, sync-ssh]
  ansible.builtin.shell: |
    SCRIPT_PATH="/usr/local/bin/sync-ssh-keys"
    FAILED=0

    sync_on_container() {
      CTID=$1
      STATUS=$(pct status $CTID | awk '{print $2}')

      if [ "$STATUS" = "running" ]; then
        if pct exec $CTID -- test -f "$SCRIPT_PATH"; then
          OUTPUT=$(pct exec $CTID -- "$SCRIPT_PATH" 2>&1)
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 0 ]; then
            echo "$CTID:$OUTPUT"
          else
            echo "$CTID:failed (exit=$EXIT_CODE): $OUTPUT" >&2
            return 1
          fi
        else
          echo "$CTID:skipped (script not installed)"
        fi
      else
        echo "$CTID:skipped (not running)"
      fi
    }

    for CTID in $(pct list | awk 'NR>1 {print $1}'); do
      sync_on_container $CTID || FAILED=1
    done
    exit $FAILED

  register: sync_result
  changed_when: "'updated' in sync_result.stdout"
