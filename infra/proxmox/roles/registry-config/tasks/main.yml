---
# Create registry data directory and install garbage collection timer

- name: ensure registry data directory exists
  ansible.builtin.file:
    path: "{{ registry_data_path }}"
    state: directory
    mode: '0755'

- name: copy registry-gc service
  ansible.builtin.copy:
    src: registry-gc.service
    dest: /etc/systemd/system/registry-gc.service
    mode: '0644'
    owner: root
    group: root
  notify: reload systemd

- name: copy registry-gc timer
  ansible.builtin.copy:
    src: registry-gc.timer
    dest: /etc/systemd/system/registry-gc.timer
    mode: '0644'
    owner: root
    group: root
  notify: reload systemd

- name: enable and start registry-gc timer
  ansible.builtin.systemd:
    name: registry-gc.timer
    enabled: yes
    state: started
    daemon_reload: yes
