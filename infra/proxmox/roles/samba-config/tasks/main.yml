---
# Configure Samba inside the LXC container

- name: verify bws CLI is available
  delegate_to: localhost
  ansible.builtin.command: which bws
  changed_when: false

- name: fetch samba password from Bitwarden Secrets Manager
  delegate_to: localhost
  ansible.builtin.command: bws secret get {{ samba_bws_secret_id }} --output json
  environment:
    BWS_ACCESS_TOKEN: "{{ vault_bws_access_token }}"
  register: bws_result
  changed_when: false
  no_log: true

- name: parse samba password
  ansible.builtin.set_fact:
    samba_password: "{{ (bws_result.stdout | from_json).value }}"
  no_log: true

- name: install samba
  ansible.builtin.apt:
    name:
      - samba
      - acl
    state: present
    update_cache: true

- name: create nas_shares group
  ansible.builtin.group:
    name: "{{ samba_group_name }}"
    gid: "{{ samba_group_gid }}"
    state: present

- name: create samba user
  ansible.builtin.user:
    name: "{{ samba_user }}"
    uid: "{{ samba_user_uid }}"
    shell: /usr/sbin/nologin
    create_home: false
    groups: "{{ samba_group_name }}"
    append: true
  register: samba_user_result

- name: set samba password
  ansible.builtin.shell: >
    printf '%s\n%s\n' '{{ samba_password }}' '{{ samba_password }}'
    | smbpasswd -s -a {{ samba_user }}
  when: samba_user_result.changed
  no_log: true

- name: ensure share directories exist with correct ownership
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ samba_user }}"
    group: "{{ samba_user }}"
    mode: "0775"
  loop: "{{ samba_shares }}"

- name: deploy smb.conf
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart smbd

- name: ensure smbd is enabled and running
  ansible.builtin.service:
    name: smbd
    state: started
    enabled: true
