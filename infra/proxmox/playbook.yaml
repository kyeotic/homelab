- name: Configure Proxmox
  hosts: proxmox
  tasks:
    - name: sync restic profile
      tags: [sync, sync-restic]
      synchronize:
        src: ../restic/profiles.yaml
        dest: /root/profiles.yaml

    - name: create restic password file
      tags: [setup]
      copy:
        content: "{{ restic_password }}"
        dest: /root/restic-password
        mode: '0600'
        owner: root
        group: root

    - name: check if resticprofile is installed
      tags: [setup]
      stat:
        path: /usr/local/bin/resticprofile
      register: resticprofile_binary

    - name: install resticprofile
      tags: [setup]
      block:
        - name: download resticprofile install script
          get_url:
            url: https://raw.githubusercontent.com/creativeprojects/resticprofile/master/install.sh
            dest: /tmp/resticprofile-install.sh
            mode: '0755'

        - name: run resticprofile install script
          command: /tmp/resticprofile-install.sh -b /usr/local/bin

        - name: cleanup install script
          file:
            path: /tmp/resticprofile-install.sh
            state: absent
      when: not resticprofile_binary.stat.exists

    - name: create proxmox directory storage for container backups
      tags: [setup]
      command:
        cmd: pvesm add dir container-backups --path /tank/container-backups --content backup
        creates: /etc/pve/storage.cfg
      register: storage_add
      failed_when:
        - storage_add.rc != 0
        - "'already exists' not in storage_add.stderr"

    - name: create lxc virtual users
      tags: [setup]
      block:
        - name: create nas_shares group for lxc mapping
          group:
            name: nas_shares
            gid: 110000
            state: present

        - name: create nas user for lxc mapping
          user:
            name: nas
            uid: 101000
            group: nas_shares
            create_home: yes
            shell: /bin/bash
            state: present

    - name: configure gpu access for unprivileged lxc containers
      tags: [setup]
      block:
        - name: copy udev rules for gpu access
          copy:
            src: 99-gpu-chmod666.rules
            dest: /etc/udev/rules.d/99-gpu-chmod666.rules
            mode: '0644'
            owner: root
            group: root
          register: udev_rules

        - name: reload udev rules
          command: udevadm control --reload-rules
          when: udev_rules.changed

        - name: trigger udev
          command: udevadm trigger
          when: udev_rules.changed

    - name: get list of container IDs
      tags: [setup, sync-ssh]
      shell: pct list | awk 'NR>1 {print $1}'
      register: container_ids
      changed_when: false

    - name: get authorized_keys checksum
      tags: [setup, sync-ssh]
      shell: sha1sum /root/.ssh/authorized_keys | cut -d' ' -f1
      register: source_authorized_keys
      changed_when: false

    - name: get container authorized_keys checksums
      tags: [setup, sync-ssh]
      shell: |
        pct exec {{ item }} -- mkdir -p /root/.ssh
        pct exec {{ item }} -- sha1sum /root/.ssh/authorized_keys 2>/dev/null | cut -d' ' -f1 || echo ""
      loop: "{{ container_ids.stdout_lines }}"
      register: container_checksums
      changed_when: false

    - name: push authorized_keys to containers
      tags: [setup, sync-ssh]
      shell: |
        pct push {{ item.item }} /root/.ssh/authorized_keys /root/.ssh/authorized_keys
        pct exec {{ item.item }} -- chmod 600 /root/.ssh/authorized_keys
      loop: "{{ container_checksums.results }}"
      when: item.stdout != source_authorized_keys.stdout

- name: Configure Caddy
  hosts: caddy
  tasks:
    - name: ensure caddy directory exists
      tags: [setup]
      file:
        path: /root/caddy
        state: directory
        mode: '0755'

    - name: sync Dockerfile
      tags: [setup]
      copy:
        src: ../caddy/Dockerfile
        dest: /root/caddy/Dockerfile
        mode: '0644'
      register: dockerfile_sync

    - name: sync compose.yaml
      tags: [setup]
      copy:
        src: ../caddy/compose.yaml
        dest: /root/caddy/compose.yaml
        mode: '0644'
      register: compose_sync

    - name: build caddy image
      tags: [setup]
      command:
        cmd: docker compose build
        chdir: /root/caddy
      when: dockerfile_sync.changed or compose_sync.changed

    - name: create env file with secrets
      tags: [setup]
      copy:
        content: |
          AWS_ACCESS_KEY={{ aws_access_key }}
          AWS_ACCESS_SECRET={{ aws_access_secret }}
        dest: /root/caddy/.env
        mode: '0600'

    - name: ensure caddy container is running
      tags: [setup]
      command:
        cmd: docker compose up -d
        chdir: /root/caddy

    - name: sync Caddyfile
      tags: [sync, sync-caddy]
      copy:
        src: ../caddy/Caddyfile
        dest: /root/caddy/Caddyfile
        mode: '0644'
      register: caddyfile_sync

    - name: reload caddy config
      tags: [sync, sync-caddy]
      command:
        cmd: docker compose exec -w /etc/caddy caddy caddy reload
        chdir: /root/caddy
      when: caddyfile_sync.changed

