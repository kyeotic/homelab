version: "1"

global:
  default-command: snapshots

default:
  repository: "rest:https://sd9j6dod:X23NkZv6sobxuAND@sd9j6dod.repo.borgbase.com"
  password-file: "~/restic-password"
  lock-timeout: "30m"
  # Automatically remove stale locks
  force-inactive-lock: true

  backup:
    verbose: true
    source:
      - "/tank/container-backups/dump"
      - "/tank/nas"
      - "/tank/apps"
      - "/tank/media_root/media/music"
    exclude:
      - "/tank/apps/**/Plex Media Server/Cache/**"
      - "/tank/apps/**/Plex Media Server/Codecs/**"
      - "/tank/apps/**/Plex Media Server/Logs/**"

# Manual test
# resticprofile -n daily backup -- --tag daily
daily:
  inherit: default
  backup:
    tag:
      - "daily"
    schedule: "*-*-* 04:00"
    schedule-permission: system
    run-before:
      # Don't run daily backup on Mondays (handled by weekly backup)
      - '[ "$(date +%u)" -ne 1 ] || echo "Skipping daily backup on Monday"'
      - '[ "$(date +%u)" -ne 1 ] || exit 0'
  retention: &daily-retention
    keep-last: 1
    prune: true
    tag: ["daily"]
  forget: *daily-retention

weekly:
  inherit: default
  backup:
    tag:
      - "weekly"
    schedule: "Mon, 04:00"
    schedule-permission: system
  retention: &weekly-retention
    keep-last: 2
    prune: true
    tag: ["weekly"]
  forget: *weekly-retention
